[package]
name = "cvld"
version = "0.2.0"
edition = "2024"
license = "FSL-1.1-ALv2"
repository = "https://git.corbet.ch/corbet-libs/cvld.git"
description = "The permanent door of the cmtymeet trust stack"
publish = false

[features]
default = ["server"]
server = ["client-http", "dep:cmty", "dep:clbs", "dep:ed25519-dalek", "dep:cpsd", "dep:crlt", "dep:csgn", "dep:cgbl", "dep:ckyh", "dep:cthl", "dep:axum", "dep:tower-http", "dep:utoipa", "dep:clap", "dep:rmcp", "dep:tokio", "dep:uuid", "dep:chrono", "dep:rand", "dep:subtle"]
client = ["dep:jsonschema"]
client-http = ["client", "dep:reqwest", "dep:url"]
client-browser = ["client", "dep:url", "dep:gloo-timers", "dep:web-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys"]
development-gate = ["server", "cgbl/development-gate"]

[dependencies]
url = { version = "2.5", optional = true }
jsonschema = { version = "0.58", default-features = false, optional = true }
cmty = { git = "https://git.corbet.ch/corbet-libs/cmty.git", branch = "v01", optional = true }
clbs = { git = "https://git.corbet.ch/corbet-foss/clbs.git", branch = "v01", optional = true }
ed25519-dalek = { version = "2.2", optional = true }
cpsd = { git = "https://git.corbet.ch/corbet-foss/cpsd.git", branch = "v01", default-features = false, features = ["storage"], optional = true }
crlt = { git = "https://git.corbet.ch/corbet-foss/crlt.git", branch = "v01", optional = true }
csgn = { git = "https://git.corbet.ch/corbet-foss/csgn.git", branch = "v01", features = ["libsql"], optional = true }
cgbl = { git = "https://git.corbet.ch/corbet-libs/cgbl.git", branch = "v01", optional = true }
ckyh = { git = "https://git.corbet.ch/corbet-foss/ckyh.git", branch = "v01", optional = true }
cthl = { git = "https://git.corbet.ch/corbet-foss/cthl.git", branch = "v01", optional = true }
axum = { version = "0.8.9", optional = true }
tower-http = { version = "0.6.11", features = ["cors"], optional = true }
utoipa = { version = "6.0.0", optional = true }
clap = { version = "4.6.7", features = ["derive", "env", "string"], optional = true }
rmcp = { version = "3.5.0", features = ["server", "client", "transport-io", "transport-child-process"], optional = true }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"], optional = true }
uuid = { version = "1", features = ["v4", "serde"], optional = true }
chrono = { version = "0.4", optional = true }
rand = { version = "0.8", optional = true }
thiserror = "2"
zeroize = "1.9"
subtle = { version = "2.6", optional = true }

[[bin]]
name = "cvld"
path = "src/main.rs"
required-features = ["server"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", optional = true }
web-sys = { version = "0.3", features = ["AbortController", "AbortSignal", "Headers", "Request", "RequestInit", "RequestMode", "Response", "Window", "ReadableStream", "ReadableStreamDefaultReader", "RequestRedirect", "RequestCredentials", "RequestCache", "ReferrerPolicy"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
crgs = { git = "https://git.corbet.ch/corbet-foss/crgs.git", branch = "v01" }
futures-util = "0.3"
passkey = "0.4"
async-trait = "0.1"
cvch = { git = "https://git.corbet.ch/corbet-foss/cvch.git", branch = "v01" }
cpns = { git = "https://git.corbet.ch/corbet-foss/cpns.git", branch = "v01" }
tempfile = "3"
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = ["softtoken"] }

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 1

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(owned_browser_coverage)"] }

[[example]]
name = "browser-fixture"
path = "tests/support/browser-fixture.rs"
required-features = ["development-gate"]
