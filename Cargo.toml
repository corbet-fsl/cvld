[package]
name = "cvld"
version = "0.2.0"
edition = "2024"
license = "FSL-1.1-ALv2"
repository = "https://git.corbet.ch/corbet-fsl/cvld.git"
description = "The permanent door of the cmtymeet trust stack"
publish = false

[features]
default = ["server"]
server = ["client-http", "cvld-client/server", "dep:cpmt", "dep:crpt", "dep:x402-types", "dep:cmty", "dep:cvch", "dep:clbs", "dep:cphn", "dep:cmbx", "dep:cfbk", "dep:ed25519-dalek", "dep:ed25519-dalek-v2", "dep:cblc", "dep:czkp", "dep:cssr", "dep:cpsd", "dep:crlt", "dep:csgn", "dep:cchr", "dep:hpke", "dep:cgbl", "dep:ckyh", "dep:governor", "dep:axum", "dep:tower-http", "dep:utoipa", "dep:schemars", "dep:clap", "dep:rmcp", "dep:tokio", "dep:uuid", "dep:chrono", "dep:rand", "dep:subtle", "dep:hkdf", "dep:tower", "dep:openssl"]
# The client features select those of `cvld-client` (callers depend on `cvld-client` itself;
# these keep this repository's own CI and wasm browser test reaching its feature sets).
client = ["cvld-client/client"]
client-http = ["client", "cvld-client/client-http", "dep:reqwest", "dep:url", "dep:rustls"]
client-ohttp = ["client", "cvld-client/client-ohttp"]
client-browser = ["client", "cvld-client/client-browser"]
development-gate = ["server", "cgbl/development-gate", "cvld-client/development-gate"]
# Contract-only view of the development action for clients; links none of the server.
development-gate-client = ["client", "cvld-client/development-gate-client"]
# Oblivious HTTP gateway in front of the door handlers (off by default).
ohttp = ["server", "dep:cblv", "cblv/gateway"]

[dependencies]
# The client-facing contract (address, client, creation-token protocol, device session, error);
# re-exported unchanged, so the server and every caller keep the `cvld::` paths.
cvld-client = { path = "client", default-features = false }
cblv = { git = "https://git.corbet.ch/corbet-libre/cblv.git", branch = "main", optional = true }
url = { version = "2.5", optional = true }
cmty = { git = "https://git.corbet.ch/corbet-fsl/cmty.git", branch = "main", optional = true }
cvch = { git = "https://git.corbet.ch/corbet-foss/cvch.git", branch = "main", optional = true }
cpmt = { git = "https://git.corbet.ch/corbet-libre/cpmt.git", branch = "main", optional = true }
crpt = { git = "https://git.corbet.ch/corbet-libre/crpt.git", branch = "main", features = ["http"], optional = true }
x402-types = { version = "2", optional = true }
clbs = { git = "https://git.corbet.ch/corbet-libre/clbs.git", branch = "main", optional = true }
cphn = { git = "https://git.corbet.ch/corbet-libre/cphn.git", branch = "main", optional = true }
cmbx = { git = "https://git.corbet.ch/corbet-libre/cmbx.git", branch = "main", optional = true }
cfbk = { git = "https://git.corbet.ch/corbet-libre/cfbk.git", branch = "main", optional = true }
ed25519-dalek = { version = "3", optional = true }
ed25519-dalek-v2 = { package = "ed25519-dalek", version = "2.2", optional = true }
cblc = { git = "https://git.corbet.ch/corbet-fsl/cblc.git", branch = "main", features = ["schema", "publication"], optional = true }
czkp = { git = "https://git.corbet.ch/corbet-foss/czkp.git", branch = "main", optional = true }
cssr = { git = "https://git.corbet.ch/corbet-libre/cssr.git", branch = "main", optional = true }
cpsd = { git = "https://git.corbet.ch/corbet-libre/cpsd.git", branch = "main", default-features = false, features = ["storage"], optional = true }
crlt = { git = "https://git.corbet.ch/corbet-libre/crlt.git", branch = "main", optional = true }
csgn = { git = "https://git.corbet.ch/corbet-libre/csgn.git", branch = "main", features = ["libsql"], optional = true }
cchr = { git = "https://git.corbet.ch/corbet-libre/cchr.git", branch = "main", optional = true }
cgbl = { git = "https://git.corbet.ch/corbet-fsl/cgbl.git", branch = "main", optional = true }
ckyh = { git = "https://git.corbet.ch/corbet-libre/ckyh.git", branch = "main", optional = true }
governor = { version = "0.10.4", default-features = false, features = ["std"], optional = true }
axum = { version = "0.8.9", optional = true }
tower-http = { version = "0.6.11", features = ["cors"], optional = true }
utoipa = { version = "6.0.0", optional = true }
schemars = { version = "1", optional = true }
clap = { version = "4.6.7", features = ["derive", "env", "string"], optional = true }
rmcp = { version = "3.5.0", features = ["server", "client", "transport-io", "transport-child-process"], optional = true }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"], optional = true }
uuid = { version = "1", features = ["v4", "serde"], optional = true }
chrono = { version = "0.4", optional = true }
rand = { version = "0.8", optional = true }
thiserror = "2"
zeroize = "1.9"
subtle = { version = "2.6", optional = true }
hkdf = { version = "0.12", optional = true }
hpke = { version = "0.14", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha", "hkdfsha2"], optional = true }
openssl = { version = "0.10", optional = true }
sha2 = "0.10"
tower = { version = "0.5", features = ["util"], optional = true }

[[bin]]
name = "cvld"
path = "src/main.rs"
required-features = ["server"]
# The binary is only an entry point: its runtime and tests live in the library
# (runtime, platform, root_issuer, signals), so no second test harness links the
# whole dependency closure.
test = false

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.79"
gloo-net = { version = "0.7", default-features = false, features = ["http", "json"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
openssl = "0.10"
tower = { version = "0.5", features = ["util"] }
blind-rsa-signatures = { version = "0.18", default-features = false }
crgs = { git = "https://git.corbet.ch/corbet-libre/crgs.git", branch = "main" }
cvfy = { git = "https://git.corbet.ch/corbet-foss/cvfy.git", branch = "main" }
rcgen = { version = "0.14", features = ["crypto"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
cgrd = { git = "https://git.corbet.ch/corbet-libre/cgrd.git", branch = "main", default-features = false }
futures-util = "0.3"
passkey = "0.4"
async-trait = "0.1"
cvch = { git = "https://git.corbet.ch/corbet-foss/cvch.git", branch = "main" }
cpns = { git = "https://git.corbet.ch/corbet-libre/cpns.git", branch = "main" }
tempfile = "3"
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = ["softtoken"] }
# A real Keys `Created` receipt for genesis stamp evidence in the device-join tests.
ckmg = { git = "https://git.corbet.ch/corbet-libre/ckmg.git", branch = "main" }
# The low-level publishing signer for the state-seam rotation tests only;
# production code verifies against published rings and never signs.
csgn = { git = "https://git.corbet.ch/corbet-libre/csgn.git", branch = "main", features = ["volatile-signer"] }
blake3 = "1"


[lints.rust]
unsafe_code = "forbid"
