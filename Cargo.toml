[package]
name = "cvld"
version = "0.2.0"
edition = "2024"
license = "FSL-1.1-ALv2"
repository = "https://git.corbet.ch/corbet-libs/cvld"
description = "The permanent door of the cmtymeet trust stack"
publish = false

[features]
default = ["server"]
server = ["client-http", "dep:cpmt", "dep:crpt", "dep:x402-types", "dep:cmty", "dep:cvch", "dep:clbs", "dep:cphn", "dep:cmbx", "dep:cfbk", "dep:ed25519-dalek", "dep:ed25519-dalek-v2", "dep:cblc", "dep:czkp", "dep:cssr", "dep:cpsd", "dep:crlt", "dep:csgn", "dep:cgbl", "dep:ckyh", "dep:governor", "dep:axum", "dep:tower-http", "dep:utoipa", "dep:clap", "dep:rmcp", "dep:tokio", "dep:uuid", "dep:chrono", "dep:rand", "dep:subtle", "dep:hkdf", "dep:sha2", "dep:tower"]
client = ["dep:jsonschema"]
client-http = ["client", "dep:reqwest", "dep:url"]
client-ohttp = ["client", "dep:url", "dep:cblv", "cblv/client"]
client-browser = ["client", "dep:url", "dep:gloo-timers", "dep:web-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys"]
development-gate = ["server", "cgbl/development-gate"]
# Contract-only view of the development action for clients; links none of the server.
development-gate-client = ["client"]
# Oblivious HTTP gateway in front of the door handlers (off by default).
ohttp = ["server", "dep:cblv", "cblv/gateway"]

[dependencies]
cblv = { git = "https://git.corbet.ch/corbet-foss/cblv.git", branch = "main", optional = true }
url = { version = "2.5", optional = true }
jsonschema = { version = "0.58", default-features = false, optional = true }
cmty = { git = "https://git.corbet.ch/corbet-libs/cmty", branch = "main", optional = true }
cvch = { git = "https://git.corbet.ch/corbet-foss/cvch", branch = "main", optional = true }
cpmt = { git = "https://git.corbet.ch/corbet-foss/cpmt", branch = "main", optional = true }
crpt = { git = "https://git.corbet.ch/corbet-foss/crpt", branch = "main", features = ["http"], optional = true }
x402-types = { version = "2", optional = true }
clbs = { git = "https://git.corbet.ch/corbet-foss/clbs", branch = "main", optional = true }
cphn = { git = "https://git.corbet.ch/corbet-foss/cphn", branch = "main", optional = true }
cmbx = { git = "https://git.corbet.ch/corbet-foss/cmbx", branch = "main", optional = true }
cfbk = { git = "https://git.corbet.ch/corbet-foss/cfbk", branch = "main", optional = true }
ed25519-dalek = { version = "3", optional = true }
ed25519-dalek-v2 = { package = "ed25519-dalek", version = "2.2", optional = true }
cblc = { git = "https://git.corbet.ch/corbet-libs/cblc", branch = "main", features = ["schema", "publication"], optional = true }
czkp = { git = "https://git.corbet.ch/corbet-foss/czkp", branch = "main", optional = true }
cssr = { git = "https://git.corbet.ch/corbet-foss/cssr", branch = "main", optional = true }
cpsd = { git = "https://git.corbet.ch/corbet-foss/cpsd", branch = "main", default-features = false, features = ["storage"], optional = true }
crlt = { git = "https://git.corbet.ch/corbet-foss/crlt", branch = "main", optional = true }
csgn = { git = "https://git.corbet.ch/corbet-foss/csgn", branch = "main", features = ["libsql"], optional = true }
cgbl = { git = "https://git.corbet.ch/corbet-libs/cgbl.git", branch = "main", optional = true }
ckyh = { git = "https://git.corbet.ch/corbet-foss/ckyh", branch = "main", optional = true }
governor = { version = "0.10.4", default-features = false, features = ["std"], optional = true }
axum = { version = "0.8.9", optional = true }
tower-http = { version = "0.6.11", features = ["cors"], optional = true }
utoipa = { version = "6.0.0", optional = true }
clap = { version = "4.6.7", features = ["derive", "env", "string"], optional = true }
rmcp = { version = "3.5.0", features = ["server", "client", "transport-io", "transport-child-process"], optional = true }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"], optional = true }
serde = { version = "1", features = ["derive"] }
any_ascii = "0.3"
blind-rsa-signatures = { version = "0.18", default-features = false }
rustrict = { version = "0.7", default-features = false, features = ["censor"] }
serde_json = "1"
tokio = { version = "1", features = ["full"], optional = true }
uuid = { version = "1", features = ["v4", "serde"], optional = true }
chrono = { version = "0.4", optional = true }
rand = { version = "0.8", optional = true }
thiserror = "2"
zeroize = "1.9"
subtle = { version = "2.6", optional = true }
hkdf = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
tower = { version = "0.5", features = ["util"], optional = true }

[[bin]]
name = "cvld"
path = "src/main.rs"
required-features = ["server"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", optional = true }
web-sys = { version = "0.3", features = ["AbortController", "AbortSignal", "Headers", "Request", "RequestInit", "RequestMode", "Response", "Window", "ReadableStream", "ReadableStreamDefaultReader", "RequestRedirect", "RequestCredentials", "RequestCache", "ReferrerPolicy"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.79"
gloo-net = { version = "0.7", default-features = false, features = ["http", "json"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
openssl = "0.10"
tower = { version = "0.5", features = ["util"] }
crgs = { git = "https://git.corbet.ch/corbet-foss/crgs", branch = "main" }
cvfy = { git = "https://git.corbet.ch/corbet-foss/cvfy", branch = "main" }
rcgen = { version = "0.14", features = ["crypto"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
cgrd = { git = "https://git.corbet.ch/corbet-foss/cgrd", branch = "main", default-features = false }
futures-util = "0.3"
passkey = "0.4"
async-trait = "0.1"
cvch = { git = "https://git.corbet.ch/corbet-foss/cvch", branch = "main" }
cpns = { git = "https://git.corbet.ch/corbet-foss/cpns", branch = "main" }
tempfile = "3"
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = ["softtoken"] }

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 1

[lints.rust]
unsafe_code = "forbid"
